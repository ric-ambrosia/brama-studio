<style>
  /* Override del layout "due pagine" per la pagina portfolio:
     qui vogliamo uno scroll verticale normale, non la traslazione. */
  html, body { height: auto; overflow: visible; overflow-x: hidden; }
  body { background: var(--bg); }

  .pf-nav {
    position: sticky; top: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 5vw;
    background: rgba(5, 10, 26, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    z-index: 10;
  }
  .pf-nav a, .pf-nav .pf-title {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink-dim);
    transition: color 0.3s;
  }
  .pf-nav a:hover { color: var(--gold); }
  .pf-nav .pf-back::before { content: "← "; }
  .pf-nav .pf-title { color: var(--ink-mute); }
  .pf-nav .pf-dl { color: var(--ink); border: 1px solid var(--line); padding: 8px 14px; border-radius: 999px; }
  .pf-nav .pf-dl:hover { border-color: var(--gold); color: var(--gold); }

  .pf-pages {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 5vw 40px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .pf-pages img {
    width: 100%; height: auto;
    display: block;
    border-radius: 4px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    background: var(--bg-2);
  }

  .pf-end {
    text-align: center;
    padding: 40px 5vw 24px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }

  @media (max-width: 560px) {
    .pf-nav { padding: 12px 4vw; }
    .pf-nav .pf-title { display: none; }
    .pf-nav a { font-size: 10px; letter-spacing: 0.2em; }
    .pf-nav .pf-dl { padding: 6px 10px; }
    .pf-pages { padding: 12px 4vw calc(40px + env(safe-area-inset-bottom)); gap: 10px; }
  }
</style>
</head>
<body class="grain">
  <nav class="pf-nav">
    <a href="index.html" class="pf-back">Brama</a>
    <span class="pf-title">Portfolio</span>
