  // Mini helper per creare DOM dichiarativamente.
  // h(tag, attrs?, ...children) — children possono essere stringhe o nodi.
  function h(tag, attrs, ...kids) {
    const el = document.createElementNS(
      tag === 'svg' || tag === 'g' || tag === 'path' || tag === 'polygon' ||
      tag === 'circle' || tag === 'line' || tag === 'rect' || tag === 'defs' ||
      tag === 'pattern' || tag === 'linearGradient' || tag === 'radialGradient' ||
      tag === 'stop' || tag === 'clipPath' || tag === 'use' || tag === 'ellipse'
        ? 'http://www.w3.org/2000/svg' : 'http://www.w3.org/1999/xhtml',
      tag
    );
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'class' || k === 'className') el.setAttribute('class', v);
        else if (k === 'onClick') el.addEventListener('click', v);
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else el.setAttribute(k, v);
      }
    }
    for (const k of kids.flat()) {
      if (k == null || k === false) continue;
      el.appendChild(typeof k === 'string' || typeof k === 'number'
        ? document.createTextNode(String(k)) : k);
    }
    return el;
  }

  // ── MASONRY (griglia opere) ─────────────────────────────────
  // Set di immagini per cui esistono thumbnail ottimizzate a 1200w
  // (sotto images/thumbs/). Per gli altri 3 originali (Abbandono, Escape,
  // La_Casa_Di_Mike) i file sono già piccoli e li serviamo direttamente.
  const HAS_THUMB_1200 = new Set(['Vertigine.jpeg','Ti_Devo_Lasciare.jpeg','Pugno_Nel_Tempo.jpeg','Depressione.jpeg','Lu.jpeg']);
  // Width approssimativa dell'originale (px) per i 3 quadri senza thumb-1200,
  // così il srcset può scegliere intelligentemente anche su display retina.
  const ORIG_W = { 'Abbandono.jpg': 785, 'Escape.jpg': 1080, 'La_Casa_Di_Mike.jpeg': 1037 };
  function thumbBase(file) {
    const dot = file.lastIndexOf('.');
    return BASE + 'thumbs/' + file.slice(0, dot);
  }
  function buildSrcset(file) {
    const base = thumbBase(file);
    // 600w sempre disponibile come primo candidato.
    const parts = [`${base}-600.jpg 600w`];
    if (HAS_THUMB_1200.has(file)) {
      parts.push(`${base}-1200.jpg 1200w`);
    } else if (ORIG_W[file]) {
      // Originale già piccolo: si usa lui come candidato "grande".
      parts.push(`${BASE}${file} ${ORIG_W[file]}w`);
    }
    return parts.join(', ');
  }

  function Masonry(onOpen) {
    const grid = h('div', { class: 'masonry', role: 'list' });
    WORKS.forEach((w, i) => {
      // <button> al posto di <div> per accessibilità tastiera (Enter/Spazio).
      const tile = h('button', {
        class: 'tile' + (w.comingSoon ? ' coming-soon' : ''),
        type: 'button',
        role: 'listitem',
        'aria-label': w.comingSoon
          ? `${w.title}, ${w.year}, in lavorazione`
          : `${w.title}, ${w.year}`,
        onClick: () => onOpen(i)
      });
      if (w.comingSoon) {
        // Tile senza immagine: placeholder testuale per opera in lavorazione.
        tile.innerHTML = `
          <div class="frame cs-frame">
            <div class="cs-stamp">In lavorazione</div>
            <div class="cs-sub">Prossimamente</div>
          </div>
          <div class="meta">
            <span class="t">${w.title}</span>
            <span class="y">${w.year}</span>
          </div>
        `;
      } else {
        // Le prime 4 thumbnails partono subito (eager + alta priorità) così
        // sono già pronte quando l'utente arriva in galleria; le altre lazy.
        const eager = i < 4;
        // srcset: 600w per mobile, 1200w per desktop retina (quando disponibile).
        // src fallback = originale, così funziona anche se il browser non capisce srcset.
        tile.innerHTML = `
          <div class="frame">
            <img src="${BASE + w.file}"
                 srcset="${buildSrcset(w.file)}"
                 sizes="(max-width: 560px) 50vw, (max-width: 900px) 50vw, 720px"
                 alt="${w.title}"
                 loading="${eager ? 'eager' : 'lazy'}"
                 decoding="async"
                 fetchpriority="${eager ? 'high' : 'low'}" />
            <div class="corner">${pad2(i + 1)} / ${WORKS.length}</div>
          </div>
          <div class="meta">
            <span class="t">${w.title}</span>
            <span class="y">${w.year}</span>
          </div>
        `;
      }
      grid.appendChild(tile);
    });
    return grid;
  }

  // ── LIGHTBOX ────────────────────────────────────────────────
  // Layout "reel" tipo Instagram: foto a tutto schermo, overlay con testi
  // in basso. Niente tasti (chiudi/fullscreen/prev/next): la navigazione è
  // solo gestuale — swipe verticale fra le opere, swipe destra per chiudere,
  // pinch nativa per zoomare.
  function Lightbox() {
    let idx = null;

    const stageImg = h('img', { src: '', alt: '' });
    // Placeholder per opere in lavorazione (nessun file disponibile).
    const stagePlaceholder = h('div', { class: 'stage-placeholder' });
    stagePlaceholder.innerHTML = `
      <div class="ph-frame">
        <div class="ph-stamp">In lavorazione</div>
        <div class="ph-sub">Prossimamente</div>
      </div>
    `;
    const stage = h('div', { class: 'stage' }, stageImg, stagePlaceholder);

    const eyebrow = h('div', { class: 'eyebrow' });
    const title   = h('h2',  { class: 'title' });
    const yearV   = h('div', { class: 'v' });
    const sizeV   = h('div', { class: 'v' });
    const matsV   = h('div', { class: 'v' });
    // Sezione "come interagire": presente solo per opere con `interaction`.
    const interactionTitle = h('div', { class: 'interaction-eyebrow' }, '↳ Come interagire');
    const interactionBody  = h('p', { class: 'interaction-body' });
    const interactionWrap  = h('div', { class: 'interaction' }, interactionTitle, interactionBody);

    // Ordine voluto: prima cosa che leggi è "come interagire" (l'utente è davanti
    // al quadro e deve sapere cosa fare), poi le specifiche tecniche.
    const info = h('aside', { class: 'info' },
      eyebrow,
      title,
      interactionWrap,
      h('div', { class: 'specs' },
        h('div', { class: 'row' }, h('div', { class: 'k' }, 'Anno'), yearV),
        h('div', { class: 'row' }, h('div', { class: 'k' }, 'Formato'), sizeV),
        h('div', { class: 'row' }, h('div', { class: 'k' }, 'Tecnica'), matsV)
      )
    );

    // Dialog ARIA: aria-labelledby punta al titolo dell'opera per gli screen reader.
    title.id = 'lightbox-title';
    const root = h('div', {
      class: 'lightbox',
      role: 'dialog',
      'aria-modal': 'true',
      'aria-labelledby': 'lightbox-title',
      'aria-hidden': 'true'
    }, stage, info);

    function paint() {
      if (idx == null) return;
      const w = WORKS[idx];
      // Stage: foto vera per le opere terminate, placeholder per "in lavorazione".
      if (w.comingSoon) {
        stageImg.removeAttribute('src');
        stageImg.style.display = 'none';
        stagePlaceholder.style.display = '';
      } else {
        stageImg.src = BASE + w.file;
        stageImg.alt = w.title;
        stageImg.style.display = '';
        stagePlaceholder.style.display = 'none';
      }
      eyebrow.textContent = `No. ${pad3(idx + 1)} · ${pad2(idx + 1)} / ${WORKS.length}`;
      title.textContent = w.title;
      yearV.textContent = w.year;
      sizeV.textContent = w.size + (w.size === '—' ? '' : ' cm');
      matsV.textContent = w.materials;
      // Sezione interazione: mostrata solo per opere con campo `interaction`.
      if (w.interaction) {
        interactionBody.textContent = w.interaction;
        interactionWrap.style.display = '';
      } else {
        interactionWrap.style.display = 'none';
      }
    }

    // Root focusable per ricevere la tastiera senza un pulsante visibile.
    root.tabIndex = -1;

    let lastFocused = null;
    function open(i) {
      idx = i;
      paint();
      lastFocused = document.activeElement;
      resetTransform();
      root.classList.add('open');
      root.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      try { history.replaceState(null, '', '#' + WORKS[i].id); } catch (_) {}
      setTimeout(() => root.focus({ preventScroll: true }), 0);
    }
    function close() {
      idx = null;
      root.classList.remove('open');
      root.setAttribute('aria-hidden', 'true');
      resetZoom();
      resetTransform();
      document.body.style.overflow = '';
      try { history.replaceState(null, '', location.pathname + location.search); } catch (_) {}
      if (lastFocused && typeof lastFocused.focus === 'function') {
        lastFocused.focus();
        lastFocused = null;
      }
    }
    function prev() {
      if (idx == null) return;
      idx = (idx - 1 + WORKS.length) % WORKS.length;
      paint();
      resetZoom();
    }
    function next() {
      if (idx == null) return;
      idx = (idx + 1) % WORKS.length;
      paint();
      resetZoom();
    }

    // ── REEL: animazioni dell'intero lightbox ────────────────────
    // Stato delle trasformazioni "macro" (sulla root, non sull'immagine):
    // usate per swipe verticale (navigazione) e swipe destra (chiusura).
    const NAV_MS = 280;
    const SPRING = 'cubic-bezier(.22, .8, .22, 1)';
    function resetTransform() {
      root.style.transition = 'none';
      root.style.transform = '';
      root.style.opacity = '';
      // Forza reflow per far ripartire transizioni successive da uno stato pulito.
      void root.offsetHeight;
      root.style.transition = '';
    }
    // dir = +1 = swipe verso l'alto = opera successiva entra dal basso.
    // dir = -1 = swipe verso il basso = opera precedente entra dall'alto.
    function animateNav(dir) {
      if (navBusy) return;
      navBusy = true;
      const OUT = `translate3d(0, ${-dir * 100}vh, 0)`;
      root.style.transition = `transform ${NAV_MS}ms ${SPRING}`;
      root.style.transform = OUT;
      setTimeout(() => {
        // Cambia opera e riposiziona al lato opposto (entry).
        if (dir > 0) next(); else prev();
        root.style.transition = 'none';
        root.style.transform = `translate3d(0, ${dir * 100}vh, 0)`;
        void root.offsetHeight;
        root.style.transition = `transform ${NAV_MS}ms ${SPRING}`;
        root.style.transform = 'translate3d(0, 0, 0)';
        setTimeout(() => {
          root.style.transition = '';
          root.style.transform = '';
          navBusy = false;
        }, NAV_MS + 10);
      }, NAV_MS + 10);
    }
    function animateClose() {
      if (navBusy) return;
      navBusy = true;
      root.style.transition = `transform ${NAV_MS}ms ${SPRING}, opacity ${NAV_MS}ms ease`;
      root.style.transform = 'translate3d(100vw, 0, 0)';
      root.style.opacity = '0';
      setTimeout(() => {
        navBusy = false;
        close();
      }, NAV_MS + 10);
    }
    let navBusy = false;

    // ── ZOOM + PAN (sempre attivo, niente più fullscreen) ────────
    let scale = 1, tx = 0, ty = 0;
    const MIN_SCALE = 1, MAX_SCALE = 5;

    function applyTransform(animate) {
      stageImg.style.transition = animate ? 'transform 0.22s cubic-bezier(.2,.8,.2,1)' : 'none';
      stageImg.style.transform  = `translate3d(${tx}px, ${ty}px, 0) scale(${scale})`;
      if (scale > 1.001) stageImg.classList.add('zoomed');
      else stageImg.classList.remove('zoomed');
    }
    function resetZoom() {
      const wasZoomed = scale > 1.001;
      scale = 1; tx = 0; ty = 0;
      applyTransform(wasZoomed);
    }
    function clampPan() {
      const w = stageImg.offsetWidth  * scale;
      const h = stageImg.offsetHeight * scale;
      const cw = stage.clientWidth;
      const ch = stage.clientHeight;
      const maxX = Math.max(0, (w - cw) / 2);
      const maxY = Math.max(0, (h - ch) / 2);
      tx = Math.max(-maxX, Math.min(maxX, tx));
      ty = Math.max(-maxY, Math.min(maxY, ty));
    }
    function zoomAt(newScale, px, py, animate) {
      newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
      if (Math.abs(newScale - scale) < 0.001) return;
      const r = stage.getBoundingClientRect();
      const dx = px - r.left - r.width  / 2;
      const dy = py - r.top  - r.height / 2;
      const ratio = newScale / scale;
      tx = dx - (dx - tx) * ratio;
      ty = dy - (dy - ty) * ratio;
      scale = newScale;
      clampPan();
      applyTransform(animate);
    }

    // ── TOUCH GESTURES ──────────────────────────────────────────
    //   2 dita → pinch zoom (sempre attivo, anche da non-zoom)
    //   1 dito quando zoomato → pan sull'immagine
    //   1 dito quando NON zoomato → gesto di navigazione (swipe up/down/right)
    let pinchD = 0, pinchM = null;
    let panActive = false, panX = 0, panY = 0;
    let navActive = false, navStartX = 0, navStartY = 0, navStartEdge = false;
    let navDx = 0, navDy = 0;
    let lockedAxis = null; // 'h' | 'v' | null — dopo i primi ~10px, blocca l'asse

    function startNav(t) {
      navActive = true;
      navStartX = t.clientX;
      navStartY = t.clientY;
      navDx = navDy = 0;
      lockedAxis = null;
      // edge-swipe: come Instagram, il gesto di "back" funziona se parte
      // dai primi ~30px da sinistra. Più libero per gli altri assi.
      navStartEdge = t.clientX < 30;
      root.style.transition = 'none';
    }
    function endNav(commit) {
      navActive = false;
      if (!commit) {
        // Snap-back con spring.
        root.style.transition = `transform 0.22s ${SPRING}, opacity 0.22s ease`;
        root.style.transform = '';
        root.style.opacity = '';
      }
    }

    stage.addEventListener('touchstart', (e) => {
      if (navBusy) return;
      if (e.touches.length === 2) {
        const a = e.touches[0], b = e.touches[1];
        pinchD = Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
        pinchM = { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
        navActive = false; // pinch sovrascrive il gesto di navigazione
      } else if (e.touches.length === 1) {
        if (scale > 1.001) {
          panActive = true;
          panX = e.touches[0].clientX;
          panY = e.touches[0].clientY;
        } else {
          startNav(e.touches[0]);
        }
      }
    }, { passive: false });

    stage.addEventListener('touchmove', (e) => {
      if (navBusy) return;
      if (e.touches.length === 2 && pinchD > 0 && pinchM) {
        e.preventDefault();
        const a = e.touches[0], b = e.touches[1];
        const d = Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
        const m = { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
        const sRatio  = d / pinchD;
        const newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale * sRatio));
        const r = stage.getBoundingClientRect();
        const dx = m.x - r.left - r.width  / 2;
        const dy = m.y - r.top  - r.height / 2;
        const ratio = newScale / scale;
        tx = dx - (dx - tx) * ratio;
        ty = dy - (dy - ty) * ratio;
        scale = newScale;
        tx += m.x - pinchM.x;
        ty += m.y - pinchM.y;
        clampPan();
        applyTransform(false);
        pinchD = d;
        pinchM = m;
      } else if (panActive && e.touches.length === 1 && scale > 1.001) {
        e.preventDefault();
        const t = e.touches[0];
        tx += t.clientX - panX;
        ty += t.clientY - panY;
        panX = t.clientX;
        panY = t.clientY;
        clampPan();
        applyTransform(false);
      } else if (navActive && e.touches.length === 1) {
        const t = e.touches[0];
        navDx = t.clientX - navStartX;
        navDy = t.clientY - navStartY;
        // Decide asse dopo una soglia di ~10px.
        if (!lockedAxis && Math.hypot(navDx, navDy) > 10) {
          lockedAxis = Math.abs(navDx) > Math.abs(navDy) ? 'h' : 'v';
        }
        if (lockedAxis === 'h') {
          // Solo swipe verso destra (back): dx >= 0. Sinistra: niente.
          if (navDx < 0) { navDx = 0; }
          // Edge-swipe richiesto come Instagram (back). Se non parte dal bordo,
          // il gesto orizzontale non chiude — facciamo solo una piccola elastica.
          const k = navStartEdge ? 1 : 0.25;
          e.preventDefault();
          root.style.transform = `translate3d(${navDx * k}px, 0, 0)`;
          root.style.opacity = String(Math.max(0.4, 1 - (navDx * k) / window.innerWidth));
        } else if (lockedAxis === 'v') {
          e.preventDefault();
          root.style.transform = `translate3d(0, ${navDy}px, 0)`;
        }
      }
    }, { passive: false });

    stage.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) { pinchD = 0; pinchM = null; }
      if (e.touches.length === 0) panActive = false;
      if (!navActive) return;
      if (navBusy) { endNav(false); return; }
      const VH = window.innerHeight;
      const VW = window.innerWidth;
      if (lockedAxis === 'h' && navStartEdge && navDx > VW * 0.25) {
        // Swipe destra da bordo sinistro → chiudi.
        animateClose();
        navActive = false;
        return;
      }
      if (lockedAxis === 'v' && Math.abs(navDy) > VH * 0.18) {
        animateNav(navDy < 0 ? +1 : -1);
        navActive = false;
        return;
      }
      endNav(false);
    }, { passive: true });

    // Doppio tap → toggle 1x ↔ 2x verso il tap (mantiene lo zoom rapido).
    let lastTap = 0;
    stage.addEventListener('touchend', (e) => {
      if (e.changedTouches.length !== 1) return;
      if (lockedAxis) return; // se è stato un gesto, no doppio tap
      const now = performance.now();
      if (now - lastTap < 300) {
        const t = e.changedTouches[0];
        if (scale > 1.001) zoomAt(1, t.clientX, t.clientY, true);
        else                zoomAt(2, t.clientX, t.clientY, true);
      }
      lastTap = now;
    }, { passive: true });

    // ── DESKTOP ─────────────────────────────────────────────────
    // Wheel sull'immagine: con ctrlKey/metaKey (pinch del trackpad) zooma;
    // wheel normale verticale = navigazione opera ↑/↓.
    let wheelAccum = 0;
    let wheelTimer = null;
    stage.addEventListener('wheel', (e) => {
      if (navBusy) { e.preventDefault(); return; }
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
        zoomAt(scale * factor, e.clientX, e.clientY, false);
        return;
      }
      if (scale > 1.001) return; // mentre zoomato, lascia stare
      e.preventDefault();
      wheelAccum += e.deltaY;
      clearTimeout(wheelTimer);
      wheelTimer = setTimeout(() => { wheelAccum = 0; }, 180);
      if (wheelAccum > 60) { wheelAccum = 0; animateNav(+1); }
      else if (wheelAccum < -60) { wheelAccum = 0; animateNav(-1); }
    }, { passive: false });

    // Mouse drag desktop: pan quando zoomato.
    let mouseDragging = false, mouseStartX = 0, mouseStartY = 0;
    stage.addEventListener('mousedown', (e) => {
      if (scale <= 1.001) return;
      mouseDragging = true;
      mouseStartX = e.clientX;
      mouseStartY = e.clientY;
      e.preventDefault();
    });
    window.addEventListener('mousemove', (e) => {
      if (!mouseDragging) return;
      tx += e.clientX - mouseStartX;
      ty += e.clientY - mouseStartY;
      mouseStartX = e.clientX;
      mouseStartY = e.clientY;
      clampPan();
      applyTransform(false);
    });
    window.addEventListener('mouseup', () => { mouseDragging = false; });

    // Doppio click desktop → toggle zoom.
    stage.addEventListener('dblclick', (e) => {
      if (scale > 1.001) zoomAt(1, e.clientX, e.clientY, true);
      else                zoomAt(2, e.clientX, e.clientY, true);
    });

    // Clic sul backdrop (fuori da stage + info) chiude.
    root.addEventListener('click', e => {
      if (e.target === root) close();
    });

    // Tastiera: Esc chiude, frecce navigano.
    window.addEventListener('keydown', e => {
      if (!root.classList.contains('open')) return;
      if (e.key === 'Escape') { e.preventDefault(); animateClose(); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp')   { e.preventDefault(); animateNav(-1); }
      else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); animateNav(+1); }
    });

    return { root, open };
  }

  // ── GALLERY (sezione opere) ─────────────────────────────────
  // Il lightbox è montato a parte sul body, fuori da #pages, perché
  // un genitore con transform crea un nuovo containing block anche
  // per gli elementi position:fixed (e farebbe traslare anche il
  // lightbox col cambio di pagina).
  function Gallery(onOpen) {
    return h('section', {
      id: 'opere',
      class: 'gallery-section',
      'data-screen-label': 'Galleria opere'
    },
      Masonry(onOpen)
    );
  }

  // ── FOOTER ──────────────────────────────────────────────────
  function Footer() {
    return h('footer', { class: 'footer' },
      h('div', { class: 'sig' },
        h('img', { src: SIG, alt: 'brama' })
      ),
      h('a', { class: 'center', href: 'mailto:riccardo@brama.studio' }, 'riccardo@brama.studio'),
      h('div', { class: 'links' },
        h('a', {
          class: 'pdf',
          href: 'portfolio.html'
        }, 'vedi portfolio'),
        h('a', {
          class: 'pdf pdf-icon',
          href: 'presentazione.pdf',
          download: '',
          'aria-label': 'Scarica il PDF'
        },
          h('svg', {
            width: '18', height: '18',
            viewBox: '0 0 24 24',
            fill: 'none',
            stroke: 'currentColor',
            'stroke-width': '1.6',
            'stroke-linecap': 'round',
            'stroke-linejoin': 'round'
          },
            h('path', { d: 'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4' }),
            h('path', { d: 'M7 10l5 5 5-5' }),
            h('path', { d: 'M12 15V3' })
          )
        ),
        h('a', {
          class: 'ig',
          href: 'https://www.instagram.com/riccardo_bramani',
          target: '_blank',
          rel: 'noreferrer'
        }, '@riccardo_bramani')
      )
    );
  }

  // ── MOUNT ───────────────────────────────────────────────────
  // Layout "due pagine": #pages contiene la nav, l'hero (100vh) e
  // #gallery-page (anch'esso 100vh con overflow interno per la
  // galleria che può essere più lunga). Una classe .gallery su #pages
  // applica transform: translateY(-100vh) per scorrere alla pagina 2.
  // La firma sta DENTRO #pages così trasla via insieme all'hero —
  // come faceva prima quando era ancorata al documento.
  const app = document.getElementById('app');
  const lb = Lightbox();
  const galleryPage = h('div', { id: 'gallery-page' },
    Gallery(i => lb.open(i)),
    Footer()
  );
  const pages = h('div', { id: 'pages' },
    Nav(),
    Hero(),
    galleryPage
  );
  app.appendChild(pages);
  // Lightbox montato fuori da #pages (vedi commento in Gallery).
  document.body.appendChild(lb.root);
  // API per il routing via hash (#vertigine, #abbandono, ...). Usata dal
  // secondo IIFE che gestisce lo stato di pagina, e dai QR che linkano direttamente.
  window.__brama_open_work = function (slug) {
    const i = WORKS.findIndex(function (w) { return w.id === slug; });
    if (i >= 0) lb.open(i);
  };
  window.__brama_has_work = function (slug) {
    return WORKS.some(function (w) { return w.id === slug; });
  };
})();
</script>

<!-- Page state machine: hero ↔ galleria, nessun drag parziale -->
<script>
(function () {
  // Modello: due "pagine" discrete impilate verticalmente.
  //   - hero (fissa, 100vh) — sola posizione possibile in stato 'hero'
  //   - galleria (interna scrollabile) — quando in stato 'gallery',
  //     l'utente scorre liberamente dentro #gallery-page; in cima
  //     uno swipe up porta indietro all'hero.
  // Niente più snap a metà strada: la transizione è atomica via
  // CSS transform, quindi è anche fluida (GPU-composited).

  const pages = document.getElementById('pages');
  const galleryPage = document.getElementById('gallery-page');
  const SWIPE_PX = 30; // soglia di swipe per scattare la transizione
  let state = 'hero';
  let busy  = false;
  const TR_MS = 620; // durata della transizione CSS (allineato con styles.css)

  function pauseCanvas()  { if (window.__brama_canvas_pause)  window.__brama_canvas_pause(); }
  function resumeCanvas() { if (window.__brama_canvas_resume) window.__brama_canvas_resume(); }

  function goGallery() {
    if (state !== 'hero' || busy) return;
    busy = true;
    pauseCanvas(); // libera GPU durante la transizione
    pages.classList.add('gallery');
    state = 'gallery';
    setTimeout(() => { busy = false; }, TR_MS);
  }

  function goHero() {
    if (state !== 'gallery' || busy) return;
    busy = true;
    pages.classList.remove('gallery');
    state = 'hero';
    // riportiamo lo scroll interno della galleria in cima così, se
    // l'utente torna avanti, la trova dall'inizio.
    galleryPage.scrollTop = 0;
    setTimeout(() => {
      busy = false;
      resumeCanvas(); // hero di nuovo visibile → riavvia il vortice
    }, TR_MS);
  }

  // --- WHEEL (desktop) ---
  // Sull'hero blocchiamo lo scroll naturale (body è già overflow:hidden,
  // ma alcuni browser propagano comunque) e usiamo il delta come "intent".
  let wheelAccum = 0;
  let wheelResetTimer = null;
  window.addEventListener('wheel', (e) => {
    if (busy) { e.preventDefault(); return; }
    if (state === 'hero') {
      e.preventDefault();
      wheelAccum += e.deltaY;
      clearTimeout(wheelResetTimer);
      wheelResetTimer = setTimeout(() => { wheelAccum = 0; }, 140);
      if (wheelAccum > 30) { wheelAccum = 0; goGallery(); }
    } else {
      // gallery: in cima allo scroll interno + rotella in su = back
      if (galleryPage.scrollTop <= 0 && e.deltaY < -8) {
        e.preventDefault();
        goHero();
      }
    }
  }, { passive: false });

  // --- TOUCH ---
  let tStartY = 0;
  let tStartScroll = 0;
  window.addEventListener('touchstart', (e) => {
    tStartY = e.touches[0].clientY;
    tStartScroll = galleryPage.scrollTop;
  }, { passive: true });

  // In stato hero blocchiamo proprio il movimento del dito sulla pagina:
  // così non si vede mai un drag parziale, solo lo snap atomico al rilascio.
  window.addEventListener('touchmove', (e) => {
    if (state === 'hero') e.preventDefault();
  }, { passive: false });

  window.addEventListener('touchend', (e) => {
    if (busy) return;
    const dy = tStartY - e.changedTouches[0].clientY;
    if (state === 'hero') {
      if (dy > SWIPE_PX) goGallery();
    } else {
      // gallery: torna all'hero solo se l'utente era in cima e ha
      // fatto uno swipe verso il basso (dy negativo).
      if (tStartScroll <= 0 && galleryPage.scrollTop <= 0 && dy < -SWIPE_PX) goHero();
    }
  }, { passive: true });

  // --- KEYBOARD ---
  window.addEventListener('keydown', (e) => {
    if (busy) return;
    const down = e.key === 'PageDown' || e.key === 'ArrowDown' || e.key === ' ';
    const up   = e.key === 'PageUp'   || e.key === 'ArrowUp';
    if (state === 'hero' && down) { e.preventDefault(); goGallery(); }
    else if (state === 'gallery' && up && galleryPage.scrollTop <= 0) {
      e.preventDefault(); goHero();
    }
  });

  // Click sulla hint-pointer ("opere") nell'hero: invece dell'anchor #opere
  // (che non funziona perché body è overflow:hidden), lancia la transizione.
  document.addEventListener('click', (e) => {
    const hint = e.target.closest('.hint-pointer');
    if (hint) { e.preventDefault(); goGallery(); }
  });

  // --- HASH ROUTING (#<slug-opera>) ---
  // Permette di linkare un'opera specifica via QR sull'origami: il visitatore
  // apre brama.studio/#vertigine e atterra direttamente sul lightbox di quel quadro.
  function jumpToGalleryInstant() {
    // Stesso effetto di goGallery() ma senza animazione: utile all'avvio,
    // così chi arriva da un QR non vede lo scorrimento hero→galleria.
    if (state === 'gallery') return;
    const prev = pages.style.transition;
    pages.style.transition = 'none';
    pages.classList.add('gallery');
    // Forza un reflow per applicare il "salto" prima di ripristinare la transition.
    void pages.offsetHeight;
    pages.style.transition = prev;
    state = 'gallery';
    pauseCanvas();
  }
  function applyHashLocation(initial) {
    const slug = (location.hash || '').replace(/^#/, '');
    if (!slug || !window.__brama_has_work || !window.__brama_has_work(slug)) return;
    if (state === 'hero') {
      if (initial) jumpToGalleryInstant();
      else goGallery();
    }
    if (window.__brama_open_work) window.__brama_open_work(slug);
  }
  // Iniziale: se l'URL ha già un hash valido all'avvio, apri quel quadro.
  applyHashLocation(true);
  // Dinamico: navigazione interna (click sulla tile aggiorna l'hash → niente
  // re-render; ma se cambia da fuori, ad es. avanti/indietro del browser, reagisci).
  window.addEventListener('hashchange', () => applyHashLocation(false));
})();
</script>
</body>
</html>
