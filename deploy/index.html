  // Mini helper per creare DOM dichiarativamente.
  // h(tag, attrs?, ...children) — children possono essere stringhe o nodi.
  function h(tag, attrs, ...kids) {
    const el = document.createElementNS(
      tag === 'svg' || tag === 'g' || tag === 'path' || tag === 'polygon' ||
      tag === 'circle' || tag === 'line' || tag === 'rect' || tag === 'defs' ||
      tag === 'pattern' || tag === 'linearGradient' || tag === 'radialGradient' ||
      tag === 'stop' || tag === 'clipPath' || tag === 'use' || tag === 'ellipse'
        ? 'http://www.w3.org/2000/svg' : 'http://www.w3.org/1999/xhtml',
      tag
    );
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'class' || k === 'className') el.setAttribute('class', v);
        else if (k === 'onClick') el.addEventListener('click', v);
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else el.setAttribute(k, v);
      }
    }
    for (const k of kids.flat()) {
      if (k == null || k === false) continue;
      el.appendChild(typeof k === 'string' || typeof k === 'number'
        ? document.createTextNode(String(k)) : k);
    }
    return el;
  }

  // ── MASONRY (griglia opere) ─────────────────────────────────
  // Set di immagini per cui esistono thumbnail ottimizzate a 1200w
  // (sotto images/thumbs/). Per gli altri 3 originali (Abbandono, Escape,
  // La_Casa_Di_Mike) i file sono già piccoli e li serviamo direttamente.
  const HAS_THUMB_1200 = new Set(['Vertigine.jpeg','Ti_Devo_Lasciare.jpeg','Pugno_Nel_Tempo.jpeg','Depressione.jpeg','Lu.jpeg']);
  // Width approssimativa dell'originale (px) per i 3 quadri senza thumb-1200,
  // così il srcset può scegliere intelligentemente anche su display retina.
  const ORIG_W = { 'Abbandono.jpg': 785, 'Escape.jpg': 1080, 'La_Casa_Di_Mike.jpeg': 1037 };
  function thumbBase(file) {
    const dot = file.lastIndexOf('.');
    return BASE + 'thumbs/' + file.slice(0, dot);
  }
  function buildSrcset(file) {
    const base = thumbBase(file);
    // 600w sempre disponibile come primo candidato.
    const parts = [`${base}-600.jpg 600w`];
    if (HAS_THUMB_1200.has(file)) {
      parts.push(`${base}-1200.jpg 1200w`);
    } else if (ORIG_W[file]) {
      // Originale già piccolo: si usa lui come candidato "grande".
      parts.push(`${BASE}${file} ${ORIG_W[file]}w`);
    }
    return parts.join(', ');
  }

  function Masonry(onOpen) {
    const grid = h('div', { class: 'masonry', role: 'list' });
    WORKS.forEach((w, i) => {
      // <button> al posto di <div> per accessibilità tastiera (Enter/Spazio).
      const tile = h('button', {
        class: 'tile' + (w.comingSoon ? ' coming-soon' : ''),
        type: 'button',
        role: 'listitem',
        'aria-label': w.comingSoon
          ? `${w.title}, ${w.year}, in lavorazione`
          : `${w.title}, ${w.year}`,
        onClick: () => onOpen(i)
      });
      if (w.comingSoon) {
        // Tile senza immagine: placeholder testuale per opera in lavorazione.
        tile.innerHTML = `
          <div class="frame cs-frame">
            <div class="cs-stamp">In lavorazione</div>
            <div class="cs-sub">Prossimamente</div>
          </div>
          <div class="meta">
            <span class="t">${w.title}</span>
            <span class="y">${w.year}</span>
          </div>
        `;
      } else {
        // Le prime 4 thumbnails partono subito (eager + alta priorità) così
        // sono già pronte quando l'utente arriva in galleria; le altre lazy.
        const eager = i < 4;
        // srcset: 600w per mobile, 1200w per desktop retina (quando disponibile).
        // src fallback = originale, così funziona anche se il browser non capisce srcset.
        tile.innerHTML = `
          <div class="frame">
            <img src="${BASE + w.file}"
                 srcset="${buildSrcset(w.file)}"
                 sizes="(max-width: 560px) 50vw, (max-width: 900px) 50vw, 720px"
                 alt="${w.title}"
                 loading="${eager ? 'eager' : 'lazy'}"
                 decoding="async"
                 fetchpriority="${eager ? 'high' : 'low'}" />
            <div class="corner">${pad2(i + 1)} / ${WORKS.length}</div>
          </div>
          <div class="meta">
            <span class="t">${w.title}</span>
            <span class="y">${w.year}</span>
          </div>
        `;
      }
      grid.appendChild(tile);
    });
    return grid;
  }

  // ── LIGHTBOX ────────────────────────────────────────────────
  // Architettura "reel" tipo Instagram: tutte le slide sono pre-costruite
  // e impilate verticalmente dentro un container `.reel`. Per navigare si
  // trasla il reel di -idx * altezza_viewport, senza mai mostrare quello
  // che sta sotto al lightbox. Le slide verticali coprono l'intera viewport
  // (descrizione sopra l'immagine); quelle orizzontali/quadrate hanno
  // immagine in alto e descrizione sotto, in zone separate.
  function Lightbox() {
    const NAV_MS = 320;
    const SPRING = 'cubic-bezier(.22, .8, .22, 1)';
    const MIN_SCALE = 1, MAX_SCALE = 5;
    // Gesto orizzontale (back): basta un piccolo movimento per chiudere.
    const CLOSE_PX = 60;
    // Gesto verticale (next/prev): ~12% dell'altezza viewport.
    const NAV_FRAC = 0.12;
    // Tap: niente movimento e tocco breve.
    const TAP_MOVE_PX = 8;
    const TAP_MS = 400;

    // Distinzione formato del quadro: vertical = altezza > larghezza.
    // "Vertical": layout overlay (descrizione galleggia sopra l'immagine).
    // Resto: layout split (immagine in alto, descrizione in zona dedicata sotto).
    function isVertical(w) {
      if (!w.size) return false;
      const m = w.size.match(/(\d+)\s*[×x]\s*(\d+)/);
      if (!m) return false;
      return parseInt(m[2], 10) > parseInt(m[1], 10);
    }

    let idx = null;
    let scale = 1, tx = 0, ty = 0;
    let descHidden = false;
    let pinching = false;
    let navBusy = false;
    let lastFocused = null;
    // Dopo un touchend (mobile), il browser sintetizza un evento "click".
    // Per evitare che il tap-toggle dentro touchend venga annullato dal
    // click-toggle che lo segue, ignoriamo il click per ~500ms dopo touch.
    let touchClickGuard = 0;
    function isTouchClickSuppressed() {
      return performance.now() - touchClickGuard < 500;
    }

    // Costruisce una slide (immagine + info + freccia) per ogni opera.
    const slides = WORKS.map(function (w, i) {
      const titleId = 'lightbox-title-' + i;
      const eyebrow = h('div', { class: 'eyebrow' });
      eyebrow.textContent = 'No. ' + pad3(i + 1) + ' · ' + pad2(i + 1) + ' / ' + WORKS.length;
      const titleEl = h('h2', { class: 'title', id: titleId });
      titleEl.textContent = w.title;

      let stageChild = null;
      let img = null;
      if (w.comingSoon) {
        stageChild = h('div', { class: 'stage-placeholder' });
        stageChild.innerHTML =
          '<div class="ph-frame">' +
            '<div class="ph-stamp">In lavorazione</div>' +
            '<div class="ph-sub">Prossimamente</div>' +
          '</div>';
      } else {
        img = h('img', {
          src: BASE + w.file,
          srcset: buildSrcset(w.file),
          sizes: '100vw',
          alt: w.title,
          loading: 'lazy',
          decoding: 'async'
        });
        stageChild = img;
      }
      const stage = h('div', { class: 'stage' }, stageChild);

      const infoChildren = [eyebrow, titleEl];
      if (w.interaction) {
        const intEy = h('div', { class: 'interaction-eyebrow' }, '↳ Come interagire');
        const intBd = h('p', { class: 'interaction-body' });
        intBd.textContent = w.interaction;
        infoChildren.push(h('div', { class: 'interaction' }, intEy, intBd));
      }
      function specsRow(k, v) {
        return h('div', { class: 'row' },
          h('div', { class: 'k' }, k),
          h('div', { class: 'v' }, v)
        );
      }
      infoChildren.push(h('div', { class: 'specs' },
        specsRow('Anno', String(w.year)),
        specsRow('Formato', w.size + (w.size === '—' ? '' : ' cm')),
        specsRow('Tecnica', w.materials)
      ));
      const info = h('aside', { class: 'info' }, ...infoChildren);

      // Freccia in basso: identica nello stile a quella dell'hero (homepage).
      // Click → opera successiva, stesso effetto dello swipe verso l'alto.
      const arrow = h('button', {
        class: 'next-arrow',
        type: 'button',
        'aria-label': 'Opera successiva'
      });
      arrow.innerHTML =
        '<svg viewBox="0 0 24 36" aria-hidden="true">' +
          '<path d="M 12 2 L 12 28 M 4 20 L 12 30 L 20 20" ' +
                'fill="none" stroke="currentColor" stroke-width="2" ' +
                'stroke-linecap="round" stroke-linejoin="round" />' +
        '</svg>';
      arrow.addEventListener('click', function (ev) {
        ev.stopPropagation();
        animateNav(+1);
      });

      const slide = h('div', { class: 'slide' + (isVertical(w) ? ' vertical' : '') });
      slide.appendChild(stage);
      slide.appendChild(info);
      slide.appendChild(arrow);
      return { root: slide, img: img, info: info, arrow: arrow, titleId: titleId };
    });

    const reel = h('div', { class: 'reel' });
    slides.forEach(function (s) { reel.appendChild(s.root); });

    const root = h('div', {
      class: 'lightbox',
      role: 'dialog',
      'aria-modal': 'true',
      'aria-hidden': 'true',
      tabIndex: -1
    }, reel);

    // Variabile CSS --vh per altezza slide affidabile anche con la barra URL
    // di iOS Safari che mostra/nasconde durante lo scroll.
    function updateVH() {
      root.style.setProperty('--vh', window.innerHeight + 'px');
    }
    updateVH();
    window.addEventListener('resize', updateVH);
    window.addEventListener('orientationchange', updateVH);

    function currentImg() { return slides[idx] && slides[idx].img; }

    function applyZoom(animate) {
      const img = currentImg();
      if (!img) return;
      img.style.transition = animate ? 'transform 0.22s ' + SPRING : 'none';
      img.style.transform = 'translate3d(' + tx + 'px, ' + ty + 'px, 0) scale(' + scale + ')';
      if (scale > 1.001) img.classList.add('zoomed');
      else img.classList.remove('zoomed');
    }
    function resetZoomOnImg(img) {
      if (!img) return;
      img.style.transition = 'none';
      img.style.transform = '';
      img.classList.remove('zoomed');
    }
    function clampPan() {
      const img = currentImg();
      if (!img) return;
      const w = img.offsetWidth * scale;
      const hh = img.offsetHeight * scale;
      const cw = window.innerWidth;
      const ch = window.innerHeight;
      const maxX = Math.max(0, (w - cw) / 2);
      const maxY = Math.max(0, (hh - ch) / 2);
      tx = Math.max(-maxX, Math.min(maxX, tx));
      ty = Math.max(-maxY, Math.min(maxY, ty));
    }

    function setReelTo(i, animate) {
      const slideH = window.innerHeight;
      reel.style.transition = animate ? ('transform ' + NAV_MS + 'ms ' + SPRING) : 'none';
      reel.style.transform = 'translate3d(0, ' + (-i * slideH) + 'px, 0)';
      if (!animate) {
        // force reflow per uno stato pulito di transition successive
        void reel.offsetHeight;
      }
    }
    function setIndex(i, animate) {
      if (idx != null && idx !== i) resetZoomOnImg(slides[idx].img);
      idx = i;
      scale = 1; tx = 0; ty = 0;
      setReelTo(i, animate);
      try { history.replaceState(null, '', '#' + WORKS[i].id); } catch (_) {}
      if (slides[i]) root.setAttribute('aria-labelledby', slides[i].titleId);
    }
    function animateNav(dir) {
      if (navBusy || idx == null) return;
      const newIdx = (idx + dir + WORKS.length) % WORKS.length;
      navBusy = true;
      // Resetta tap-state: dopo navigazione la descrizione è di nuovo visibile.
      descHidden = false;
      root.classList.remove('text-hidden');
      setIndex(newIdx, true);
      setTimeout(function () { navBusy = false; }, NAV_MS + 30);
    }
    function animateClose() {
      if (navBusy) return;
      navBusy = true;
      root.style.transition = 'transform ' + NAV_MS + 'ms ' + SPRING + ', opacity ' + NAV_MS + 'ms ease';
      root.style.transform = 'translate3d(100vw, 0, 0)';
      root.style.opacity = '0';
      setTimeout(function () { navBusy = false; close(); }, NAV_MS + 30);
    }
    function resetRootTransform() {
      root.style.transition = 'none';
      root.style.transform = '';
      root.style.opacity = '';
      void root.offsetHeight;
      root.style.transition = '';
    }

    function open(i) {
      lastFocused = document.activeElement;
      resetRootTransform();
      setIndex(i, false);
      root.classList.add('open');
      root.classList.remove('text-hidden', 'pinching');
      descHidden = false;
      pinching = false;
      root.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      setTimeout(function () { root.focus({ preventScroll: true }); }, 0);
    }
    function close() {
      if (idx != null) resetZoomOnImg(slides[idx].img);
      idx = null;
      scale = 1; tx = 0; ty = 0;
      root.classList.remove('open', 'text-hidden', 'pinching');
      root.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      resetRootTransform();
      try { history.replaceState(null, '', location.pathname + location.search); } catch (_) {}
      if (lastFocused && typeof lastFocused.focus === 'function') {
        lastFocused.focus();
        lastFocused = null;
      }
    }

    // ── GESTURES (touch) ─────────────────────────────────────────
    // Un singolo gesture object per descrivere lo stato del tocco corrente.
    let gesture = null;

    root.addEventListener('touchstart', function (e) {
      if (navBusy) return;
      // Tap sulla freccia: lascia che gestisca il suo onclick, non avviare
      // gesti su root (evita di interpretare il tap come "toggle descrizione").
      if (e.target.closest('.next-arrow')) return;
      if (e.touches.length === 2) {
        const a = e.touches[0], b = e.touches[1];
        gesture = {
          type: 'pinch',
          d: Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY),
          m: { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 }
        };
        pinching = true;
        root.classList.add('pinching');
      } else if (e.touches.length === 1) {
        const t = e.touches[0];
        gesture = {
          type: scale > 1.001 ? 'pan' : 'maybe-tap',
          startX: t.clientX, startY: t.clientY,
          lastX: t.clientX, lastY: t.clientY,
          startTime: performance.now(),
          moved: false,
          axis: null,
          baseReelY: -idx * window.innerHeight
        };
        reel.style.transition = 'none';
        root.style.transition = 'none';
      }
    }, { passive: false });

    root.addEventListener('touchmove', function (e) {
      if (navBusy || !gesture) return;
      // Pinch (2 dita)
      if (gesture.type === 'pinch' && e.touches.length === 2) {
        e.preventDefault();
        const a = e.touches[0], b = e.touches[1];
        const d = Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
        const m = { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
        const sRatio = d / gesture.d;
        const newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale * sRatio));
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        const dx = m.x - cx;
        const dy = m.y - cy;
        const ratio = newScale / scale;
        tx = dx - (dx - tx) * ratio;
        ty = dy - (dy - ty) * ratio;
        scale = newScale;
        tx += m.x - gesture.m.x;
        ty += m.y - gesture.m.y;
        clampPan();
        applyZoom(false);
        gesture.d = d;
        gesture.m = m;
        return;
      }
      if (e.touches.length !== 1) return;
      const t = e.touches[0];
      const dx = t.clientX - gesture.startX;
      const dy = t.clientY - gesture.startY;
      gesture.lastX = t.clientX;
      gesture.lastY = t.clientY;
      if (!gesture.moved && Math.hypot(dx, dy) > TAP_MOVE_PX) gesture.moved = true;

      if (gesture.type === 'pan') {
        // Pan immagine zoomata
        e.preventDefault();
        const ddx = t.clientX - (gesture.panLastX || gesture.startX);
        const ddy = t.clientY - (gesture.panLastY || gesture.startY);
        tx += ddx; ty += ddy;
        gesture.panLastX = t.clientX;
        gesture.panLastY = t.clientY;
        clampPan();
        applyZoom(false);
        return;
      }

      if (gesture.type === 'maybe-tap' && gesture.moved && !gesture.axis) {
        gesture.axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
        gesture.type = 'nav';
      }
      if (gesture.axis === 'h') {
        e.preventDefault();
        const ddx = Math.max(0, dx); // solo verso destra
        root.style.transform = 'translate3d(' + ddx + 'px, 0, 0)';
        root.style.opacity = String(Math.max(0.5, 1 - ddx / window.innerWidth));
      } else if (gesture.axis === 'v') {
        e.preventDefault();
        const newY = gesture.baseReelY + dy;
        reel.style.transform = 'translate3d(0, ' + newY + 'px, 0)';
      }
    }, { passive: false });

    root.addEventListener('touchend', function (e) {
      touchClickGuard = performance.now();
      // Pinch terminato
      if (gesture && gesture.type === 'pinch' && e.touches.length < 2) {
        pinching = false;
        root.classList.remove('pinching');
        // Dopo il pinch la descrizione torna sempre visibile.
        descHidden = false;
        root.classList.remove('text-hidden');
        // Se l'utente è quasi tornato a 1x, snap a 1.
        if (scale < 1.05) {
          scale = 1; tx = 0; ty = 0;
          applyZoom(true);
        }
        gesture = null;
        return;
      }
      if (e.touches.length !== 0 || !gesture) return;

      // Tap (singolo, nessun movimento, durata breve) → toggle descrizione.
      if (gesture.type === 'maybe-tap' && !gesture.moved) {
        const dt = performance.now() - gesture.startTime;
        if (dt < TAP_MS) {
          descHidden = !descHidden;
          if (descHidden) root.classList.add('text-hidden');
          else root.classList.remove('text-hidden');
        }
        gesture = null;
        return;
      }

      // Pan finito → niente da committare, lascia lo zoom dov'è.
      if (gesture.type === 'pan') { gesture = null; return; }

      // Navigazione: commit o snap-back.
      if (gesture.type === 'nav') {
        const VH = window.innerHeight;
        const dxFinal = gesture.lastX - gesture.startX;
        const dyFinal = gesture.lastY - gesture.startY;
        if (gesture.axis === 'h') {
          if (dxFinal > CLOSE_PX) {
            animateClose();
          } else {
            // Snap-back orizzontale.
            root.style.transition = 'transform 0.24s ' + SPRING + ', opacity 0.24s ease';
            root.style.transform = '';
            root.style.opacity = '';
          }
        } else if (gesture.axis === 'v') {
          if (dyFinal < -VH * NAV_FRAC) animateNav(+1);
          else if (dyFinal > VH * NAV_FRAC) animateNav(-1);
          else setReelTo(idx, true);
        }
      }
      gesture = null;
    }, { passive: true });

    // ── DESKTOP ─────────────────────────────────────────────────
    // Wheel: pinch trackpad (ctrlKey/metaKey) zooma; verticale normale = navigazione.
    let wheelAccum = 0;
    let wheelTimer = null;
    root.addEventListener('wheel', function (e) {
      if (navBusy) { e.preventDefault(); return; }
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
        const newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale * factor));
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        const dx = e.clientX - cx;
        const dy = e.clientY - cy;
        const ratio = newScale / scale;
        tx = dx - (dx - tx) * ratio;
        ty = dy - (dy - ty) * ratio;
        scale = newScale;
        clampPan();
        applyZoom(false);
        return;
      }
      if (scale > 1.001) return;
      e.preventDefault();
      wheelAccum += e.deltaY;
      clearTimeout(wheelTimer);
      wheelTimer = setTimeout(function () { wheelAccum = 0; }, 200);
      if (wheelAccum > 60) { wheelAccum = 0; animateNav(+1); }
      else if (wheelAccum < -60) { wheelAccum = 0; animateNav(-1); }
    }, { passive: false });

    // Mouse drag desktop quando zoomato: pan.
    let mouseDragging = false, mouseLastX = 0, mouseLastY = 0;
    root.addEventListener('mousedown', function (e) {
      if (e.target.closest('.next-arrow')) return;
      if (scale <= 1.001) return;
      mouseDragging = true;
      mouseLastX = e.clientX;
      mouseLastY = e.clientY;
      e.preventDefault();
    });
    window.addEventListener('mousemove', function (e) {
      if (!mouseDragging) return;
      tx += e.clientX - mouseLastX;
      ty += e.clientY - mouseLastY;
      mouseLastX = e.clientX;
      mouseLastY = e.clientY;
      clampPan();
      applyZoom(false);
    });
    window.addEventListener('mouseup', function () { mouseDragging = false; });

    // Click sull'immagine (non sulla freccia) → toggle descrizione, come tap.
    // Su mobile il click viene sintetizzato dopo il touchend: lo sopprimiamo
    // per ~500ms in modo che il toggle scatti una sola volta (in touchend).
    root.addEventListener('click', function (e) {
      if (e.target.closest('.next-arrow')) return;
      if (mouseDragging) return;
      if (isTouchClickSuppressed()) return;
      descHidden = !descHidden;
      if (descHidden) root.classList.add('text-hidden');
      else root.classList.remove('text-hidden');
    });

    // Doppio click desktop: toggle zoom 1x/2x verso il cursore.
    root.addEventListener('dblclick', function (e) {
      if (e.target.closest('.next-arrow')) return;
      if (scale > 1.001) {
        scale = 1; tx = 0; ty = 0;
        applyZoom(true);
      } else {
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        scale = 2;
        tx = -(e.clientX - cx);
        ty = -(e.clientY - cy);
        clampPan();
        applyZoom(true);
      }
    });

    // Tastiera: Esc chiude, frecce navigano.
    // Se il menu è aperto, lasciamogli gestire Esc senza che il lightbox reagisca.
    window.addEventListener('keydown', function (e) {
      if (document.body.classList.contains('menu-open')) return;
      if (!root.classList.contains('open')) return;
      if (e.key === 'Escape') { e.preventDefault(); animateClose(); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp')   { e.preventDefault(); animateNav(-1); }
      else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); animateNav(+1); }
    });

    return { root: root, open: open, close: close };
  }

  // ── GALLERY (sezione opere) ─────────────────────────────────
  // Il lightbox è montato a parte sul body, fuori da #pages, perché
  // un genitore con transform crea un nuovo containing block anche
  // per gli elementi position:fixed (e farebbe traslare anche il
  // lightbox col cambio di pagina).
  function Gallery(onOpen) {
    return h('section', {
      id: 'opere',
      class: 'gallery-section',
      'data-screen-label': 'Galleria opere'
    },
      Masonry(onOpen)
    );
  }

  // ── FOOTER ──────────────────────────────────────────────────
  function Footer() {
    return h('footer', { class: 'footer' },
      h('div', { class: 'sig' },
        h('img', { src: SIG, alt: 'brama' })
      ),
      h('a', { class: 'center', href: 'mailto:riccardo@brama.studio' }, 'riccardo@brama.studio'),
      h('div', { class: 'links' },
        h('a', {
          class: 'pdf',
          href: 'portfolio.html'
        }, 'vedi portfolio'),
        h('a', {
          class: 'pdf pdf-icon',
          href: 'presentazione.pdf',
          download: '',
          'aria-label': 'Scarica il PDF'
        },
          h('svg', {
            width: '18', height: '18',
            viewBox: '0 0 24 24',
            fill: 'none',
            stroke: 'currentColor',
            'stroke-width': '1.6',
            'stroke-linecap': 'round',
            'stroke-linejoin': 'round'
          },
            h('path', { d: 'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4' }),
            h('path', { d: 'M7 10l5 5 5-5' }),
            h('path', { d: 'M12 15V3' })
          )
        ),
        h('a', {
          class: 'ig',
          href: 'https://www.instagram.com/riccardo_bramani',
          target: '_blank',
          rel: 'noreferrer'
        }, '@riccardo_bramani')
      )
    );
  }

  // ── MOUNT ───────────────────────────────────────────────────
  // Layout "due pagine": #pages contiene la nav, l'hero (100vh) e
  // #gallery-page (anch'esso 100vh con overflow interno per la
  // galleria che può essere più lunga). Una classe .gallery su #pages
  // applica transform: translateY(-100vh) per scorrere alla pagina 2.
  // La firma sta DENTRO #pages così trasla via insieme all'hero —
  // come faceva prima quando era ancorata al documento.
  const app = document.getElementById('app');
  const lb = Lightbox();
  const galleryPage = h('div', { id: 'gallery-page' },
    Gallery(i => lb.open(i)),
    Footer()
  );
  const pages = h('div', { id: 'pages' },
    Nav(),
    Hero(),
    galleryPage
  );
  app.appendChild(pages);
  // Lightbox montato fuori da #pages (vedi commento in Gallery).
  document.body.appendChild(lb.root);

  // ── MENU (hamburger top-right, panel a scorrimento dall'alto) ──────
  // Persistente: visibile su hero, galleria e dentro al lightbox.
  // Stilisticamente ispirato al menu di apple.com — l'icona burger
  // morpha a X in modo fluido, il pannello scende con backdrop blur.
  const menu = (function () {
    const burger = h('button', {
      class: 'menu-toggle',
      type: 'button',
      'aria-label': 'Apri menu',
      'aria-expanded': 'false',
      'aria-controls': 'menu-panel'
    });
    burger.innerHTML =
      '<span class="burger-line"></span>' +
      '<span class="burger-line"></span>' +
      '<span class="burger-line"></span>';

    const panel = h('div', {
      class: 'menu-panel',
      id: 'menu-panel',
      'aria-hidden': 'true'
    });
    // Voci flat (niente più sezioni). Stile mono uppercase blu più acceso.
    // Le icone Instagram/Email sono SVG line-art coerenti col resto del sito.
    panel.innerHTML = `
      <nav class="menu-nav" aria-label="Menu principale">
        <a href="#" class="menu-link" data-action="hero">Homepage</a>
        <a href="#" class="menu-link" data-action="gallery">Opere</a>
        <a href="portfolio.html" class="menu-link">Portfolio</a>
        <a href="https://www.instagram.com/riccardo_bramani" target="_blank" rel="noreferrer" class="menu-link menu-link-icon">
          <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5" ry="5" />
            <circle cx="12" cy="12" r="4" />
            <circle cx="17.5" cy="6.5" r="0.6" fill="currentColor" stroke="none" />
          </svg>
          <span class="menu-handle">@riccardo_bramani</span>
        </a>
        <a href="mailto:riccardo@brama.studio" class="menu-link menu-link-icon">
          <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5.5" width="18" height="13" rx="2" ry="2" />
            <path d="M 3 7 L 12 13 L 21 7" />
          </svg>
          <span class="menu-handle">riccardo@brama.studio</span>
        </a>
      </nav>
    `;

    function isOpen() { return burger.classList.contains('open'); }
    function openMenu() {
      burger.classList.add('open');
      panel.classList.add('open');
      burger.setAttribute('aria-expanded', 'true');
      burger.setAttribute('aria-label', 'Chiudi menu');
      panel.setAttribute('aria-hidden', 'false');
      // Marker globale: lo state-machine usa questa class per ignorare i suoi
      // handler di wheel/touch quando il menu è in primo piano (altrimenti
      // scrollare dentro al menu fa anche scorrere la pagina sotto).
      document.body.classList.add('menu-open');
    }
    function closeMenu() {
      burger.classList.remove('open');
      panel.classList.remove('open');
      burger.setAttribute('aria-expanded', 'false');
      burger.setAttribute('aria-label', 'Apri menu');
      panel.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('menu-open');
    }
    burger.addEventListener('click', function () {
      if (isOpen()) closeMenu(); else openMenu();
    });
    panel.addEventListener('click', function (e) {
      const link = e.target.closest('.menu-link');
      if (!link) return;
      closeMenu();
      // "Homepage" / "Opere": navigazione interna allo state-machine.
      // Se la lightbox è aperta la chiudiamo per prima cosa.
      if (link.dataset.action === 'hero') {
        e.preventDefault();
        if (lb.close) lb.close();
        if (window.__brama_go_hero) window.__brama_go_hero();
      } else if (link.dataset.action === 'gallery') {
        e.preventDefault();
        if (lb.close) lb.close();
        if (window.__brama_go_gallery) window.__brama_go_gallery();
      }
      // Altri link: navigazione naturale (mailto, http esterno).
    });
    // Esc chiude il menu (se aperto).
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && isOpen()) closeMenu();
    });
    document.body.appendChild(burger);
    document.body.appendChild(panel);
    return { open: openMenu, close: closeMenu };
  })();

  // API per il routing via hash (#vertigine, #abbandono, ...). Usata dal
  // secondo IIFE che gestisce lo stato di pagina, e dai QR che linkano direttamente.
  window.__brama_open_work = function (slug) {
    const i = WORKS.findIndex(function (w) { return w.id === slug; });
    if (i >= 0) lb.open(i);
  };
  window.__brama_has_work = function (slug) {
    return WORKS.some(function (w) { return w.id === slug; });
  };
})();
</script>

<!-- Vortice canvas: a questo punto #vertigine è già nel DOM (IIFE sopra è sincrono). -->
<script src="vertigine.js?v=24"></script>

<!-- Page state machine: hero ↔ galleria, nessun drag parziale -->
<script>
(function () {
  // Modello: due "pagine" discrete impilate verticalmente.
  //   - hero (fissa, 100vh) — sola posizione possibile in stato 'hero'
  //   - galleria (interna scrollabile) — quando in stato 'gallery',
  //     l'utente scorre liberamente dentro #gallery-page; in cima
  //     uno swipe up porta indietro all'hero.
  // Niente più snap a metà strada: la transizione è atomica via
  // CSS transform, quindi è anche fluida (GPU-composited).

  const pages = document.getElementById('pages');
  const galleryPage = document.getElementById('gallery-page');
  const SWIPE_PX = 30; // soglia di swipe per scattare la transizione
  let state = 'hero';
  let busy  = false;
  const TR_MS = 620; // durata della transizione CSS (allineato con styles.css)

  function pauseCanvas()  { if (window.__brama_canvas_pause)  window.__brama_canvas_pause(); }
  function resumeCanvas() { if (window.__brama_canvas_resume) window.__brama_canvas_resume(); }

  function goGallery() {
    if (state !== 'hero' || busy) return;
    busy = true;
    pauseCanvas(); // libera GPU durante la transizione
    pages.classList.add('gallery');
    state = 'gallery';
    setTimeout(() => { busy = false; }, TR_MS);
  }
  // Esposto per il menu: la voce "Vedi le opere" lo richiama direttamente.
  window.__brama_go_gallery = goGallery;

  function goHero() {
    if (state !== 'gallery' || busy) return;
    busy = true;
    pages.classList.remove('gallery');
    state = 'hero';
    // riportiamo lo scroll interno della galleria in cima così, se
    // l'utente torna avanti, la trova dall'inizio.
    galleryPage.scrollTop = 0;
    setTimeout(() => {
      busy = false;
      resumeCanvas(); // hero di nuovo visibile → riavvia il vortice
    }, TR_MS);
  }
  // Esposto per il menu: la voce "Homepage" lo richiama direttamente.
  window.__brama_go_hero = goHero;

  // Quando il menu è aperto, lo state-machine deve lasciarlo in pace:
  // scrollare dentro al pannello non deve far scattare goGallery/goHero.
  function menuIsOpen() { return document.body.classList.contains('menu-open'); }

  // --- WHEEL (desktop) ---
  // Sull'hero blocchiamo lo scroll naturale (body è già overflow:hidden,
  // ma alcuni browser propagano comunque) e usiamo il delta come "intent".
  let wheelAccum = 0;
  let wheelResetTimer = null;
  window.addEventListener('wheel', (e) => {
    if (menuIsOpen()) return;
    if (busy) { e.preventDefault(); return; }
    if (state === 'hero') {
      e.preventDefault();
      wheelAccum += e.deltaY;
      clearTimeout(wheelResetTimer);
      wheelResetTimer = setTimeout(() => { wheelAccum = 0; }, 140);
      if (wheelAccum > 30) { wheelAccum = 0; goGallery(); }
    } else {
      // gallery: in cima allo scroll interno + rotella in su = back
      if (galleryPage.scrollTop <= 0 && e.deltaY < -8) {
        e.preventDefault();
        goHero();
      }
    }
  }, { passive: false });

  // --- TOUCH ---
  let tStartY = 0;
  let tStartScroll = 0;
  window.addEventListener('touchstart', (e) => {
    if (menuIsOpen()) return;
    tStartY = e.touches[0].clientY;
    tStartScroll = galleryPage.scrollTop;
  }, { passive: true });

  // In stato hero blocchiamo proprio il movimento del dito sulla pagina:
  // così non si vede mai un drag parziale, solo lo snap atomico al rilascio.
  window.addEventListener('touchmove', (e) => {
    if (menuIsOpen()) return;
    if (state === 'hero') e.preventDefault();
  }, { passive: false });

  window.addEventListener('touchend', (e) => {
    if (menuIsOpen()) return;
    if (busy) return;
    const dy = tStartY - e.changedTouches[0].clientY;
    if (state === 'hero') {
      if (dy > SWIPE_PX) goGallery();
    } else {
      // gallery: torna all'hero solo se l'utente era in cima e ha
      // fatto uno swipe verso il basso (dy negativo).
      if (tStartScroll <= 0 && galleryPage.scrollTop <= 0 && dy < -SWIPE_PX) goHero();
    }
  }, { passive: true });

  // --- KEYBOARD ---
  window.addEventListener('keydown', (e) => {
    if (menuIsOpen()) return;
    if (busy) return;
    const down = e.key === 'PageDown' || e.key === 'ArrowDown' || e.key === ' ';
    const up   = e.key === 'PageUp'   || e.key === 'ArrowUp';
    if (state === 'hero' && down) { e.preventDefault(); goGallery(); }
    else if (state === 'gallery' && up && galleryPage.scrollTop <= 0) {
      e.preventDefault(); goHero();
    }
  });

  // Click sulla hint-pointer ("opere") nell'hero: invece dell'anchor #opere
  // (che non funziona perché body è overflow:hidden), lancia la transizione.
  document.addEventListener('click', (e) => {
    const hint = e.target.closest('.hint-pointer');
    if (hint) { e.preventDefault(); goGallery(); }
  });

  // --- HASH ROUTING (#<slug-opera>) ---
  // Permette di linkare un'opera specifica via QR sull'origami: il visitatore
  // apre brama.studio/#vertigine e atterra direttamente sul lightbox di quel quadro.
  function jumpToGalleryInstant() {
    // Stesso effetto di goGallery() ma senza animazione: utile all'avvio,
    // così chi arriva da un QR non vede lo scorrimento hero→galleria.
    if (state === 'gallery') return;
    const prev = pages.style.transition;
    pages.style.transition = 'none';
    pages.classList.add('gallery');
    // Forza un reflow per applicare il "salto" prima di ripristinare la transition.
    void pages.offsetHeight;
    pages.style.transition = prev;
    state = 'gallery';
    pauseCanvas();
  }
  function applyHashLocation(initial) {
    const slug = (location.hash || '').replace(/^#/, '');
    if (!slug || !window.__brama_has_work || !window.__brama_has_work(slug)) return;
    if (state === 'hero') {
      if (initial) jumpToGalleryInstant();
      else goGallery();
    }
    if (window.__brama_open_work) window.__brama_open_work(slug);
  }
  // Iniziale: se l'URL ha già un hash valido all'avvio, apri quel quadro.
  applyHashLocation(true);
  // Dinamico: navigazione interna (click sulla tile aggiorna l'hash → niente
  // re-render; ma se cambia da fuori, ad es. avanti/indietro del browser, reagisci).
  window.addEventListener('hashchange', () => applyHashLocation(false));
})();
</script>
